name: Try to create Oracle A1 VM

on:
  schedule:
    # GitHub often skips frequent schedules, so each run keeps trying itself:
    # one attempt every 5 minutes for about 5 hours. A new run starts every 4 hours
    # (it waits if the previous one is still going).
    - cron: "13 */4 * * *"
  workflow_dispatch:

concurrency:
  group: launch
  cancel-in-progress: false

permissions:
  actions: write    # to switch this workflow off once the VM exists
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - id: try
        name: Launch attempt
        env:
          OCI_SETTINGS: ${{ secrets.OCI_SETTINGS }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: |
          for i in $(seq 1 60); do
            echo "Attempt $i at $(date -u +%H:%M)"
            ./launch.sh
            grep -q "created=true" "$GITHUB_OUTPUT" && break
            if [ "$i" -lt 60 ]; then sleep 300; fi
          done
          exit 0  # no capacity is the normal outcome, not a failure
      - name: Stop retrying once the VM exists
        if: steps.try.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable launch.yml --repo "$GITHUB_REPOSITORY"
